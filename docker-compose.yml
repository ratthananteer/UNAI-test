services:

  mongodb:
    image: mongo:8
    container_name: unai-mongodb
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: unai-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb+srv://ratthanan2560_db_user:5dxpsed23yWmUHHT@cluster0.gi5baxk.mongodb.net/
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: unai-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  mongo_data: