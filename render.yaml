services:
  - type: web
    name: unai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: UNAI_USERNAME
        sync: false
      - key: UNAI_PASSWORD
        sync: false
      - key: UNAI_SOCKET_URL
        sync: false
      - key: APIFLOOR_URL
        value: https://rtls.lailab.online/api/v1/get_all_floor
      - key: APIANCHOR_URL
        value: https://rtls.lailab.online/api/v1/get_all_anchor
      - key: APIZONE_URL
        value: https://rtls.lailab.online/api/v1/get_all_zone
      - key: APIPLACE_URL
        value: https://rtls.lailab.online/api/v1/get_all_place
      - key: APIBUILDING_URL
        value: https://rtls.lailab.online/api/v1/get_all_building
      - key: APITAG_URL
        value: https://rtls.lailab.online/api/v1/get_all_tag
      - key: TAG_ALIVE_TIMEOUT_SECONDS
        value: "10"
      - key: TAG_SCREEN_INTERVAL_SECONDS
        value: "2"
      - key: ADMIN_CLEANUP_SECRET
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: AUTH_USER_TOKEN_DAYS
        value: "30"
      - key: AUTH_ADMIN_TOKEN_MINUTES
        value: "120"
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false

  - type: web
    name: unai-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Frontend Next.js rewrites /api/* requests to the backend service.
      # Resolve the backend's actual Render URL instead of hard-coding an old
      # onrender.com hostname (for example, unai-r). This keeps /api/realtime,
      # /api/db-tags and /api/active-tags on the same backend deployment.
      - key: BACKEND_URL
        fromService:
          type: web
          name: unai-backend
          envVarKey: RENDER_EXTERNAL_URL
